<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ATBALLPARK - Scan</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <link rel="stylesheet" href="CSS/globals/global.css">
    <link rel="stylesheet" href="CSS/globals/global-sidebar.css">
    <link rel="stylesheet" href="CSS/Scan.css">
</head>


<body>

    <section class="section-header" id="main-site-header">
        <div class="container">
            <header class="site-header">
                <div class="top-bar">
                    <div class="logo"><span class="text-white">AT</span><span class="text-red">BALLPARK</span></div>

                    <div class="header-actions">
                       
                        <div class="logo-hamburguesa">
                            <button class="button-menu">
                                <img src="images/menu.svg" alt="menu de opciones" class="menu-logo">
                            </button>
                        </div>
                    </div>
                </div>

                <nav class="nav-tabs">
                    <a href="index.html" class="tab">INICIO</a>
                    <a href="Principal.html" class="tab">PRINCIPAL</a>
                    <a href="historia.html" class="tab">HISTORIA</a>
                    <a href="temporada.html" class="tab">TEMPORADA</a>
                    <a href="leyendas.html" class="tab">LEYENDAS</a>
                    <a href="roster.html" class="tab">ROSTER</a>
                    <a href="trivia.html" class="tab">TRIVIA</a>
                    <a href="Scan.html" class="tab active">ESCANEAR</a>
                </nav>


                <div class="mobile-menu" id="mobile-menu">
                    <div class="mobile-menu-header">
                        <div class="logo">
                            <span class="text-white">AT</span><span class="text-red">BALLPARK</span>
                        </div>

                        <button class="mobile-menu-close" id="mobile-menu-close">
                            <img src="images/close-menu.svg" alt="botón cerrar menú" class="close-logo">
                        </button>
                    </div>

                    <nav class="mobile-nav">
                        <a href="index.html">INICIO</a>
                        <a href="Principal.html">PRINCIPAL</a>
                        <a href="historia.html">HISTORIA</a>
                        <a href="temporada.html">TEMPORADA</a>
                        <a href="leyendas.html">LEYENDAS</a>
                        <a href="roster.html">ROSTER</a>
                        <a href="trivia.html">TRIVIA</a>
                        <a href="Scan.html" class="active">ESCANEAR</a>
                    </nav>
                </div>

                <div class="mobile-overlay" id="mobile-overlay"></div>
            </header>
        </div>
    </section>

    <a-scene
        mindar-image="imageTargetSrc: ar_targets/targets.mind;"
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
            <a-gltf-model
                id="ar-model"
                src="models/Dandy_Yankees.glb"
                position="0 0 0"
                rotation="0 0 0"
                scale="0.2 0.2 0.2"
                >
            </a-gltf-model>
        </a-entity>
    </a-scene>
    <div class="ar-buttons">
        <button id="animate-btn" class="animate-btn" hidden="true">Animacion</button>
        <button id="btn-escaneo">Escanéo</button>
    </div>
    <dialog id="modal-escaneo">
        <div class="interfaz-contenedor">
            <img src="images/logo.png" alt="Logo Superior" class="logo-superior">
            <div class="espacio-modelo-3d" id="contenedor-3d">
            </div>
            <div class="caja-info">
                <div class="cabecera-info">
                    <div style="width: 26px;"></div>
                    <p id="texto-info-equipo" class="texto-info">Información relevante a The New York Yankees</p>
                    <a id="btn-ir-principal" href="Principal.html?equipo=NYY" class="btn-info" title="Ir a Principal">i</a>
                </div>
                <div class="botones-accion">
                    <button id="btn-regresar" class="btn-rojo">Regresar</button>
                    <button id="btn-jugar" class="btn-verde">Jugar</button>
                </div>
            </div>
        </div>
    </dialog>
    <dialog id="modal-minijuego">
        <div class="modal-contenido-juego">
            <button id="btn-cerrar-minijuego" class="cerrar-modal">&times;</button>
            <h2>Zona de Minijuego</h2>
            <img src="images/minigame.jpeg" alt="Logo Superior">
            <p>Aquí irá el canvas del juego.</p>
        </div>
    </dialog>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="JS/global.js"></script>
    <script src="JS/scriptScan.js"></script>
    </body>
    </html>
